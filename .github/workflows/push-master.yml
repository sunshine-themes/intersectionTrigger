name: ci

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  main:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
          registry-url: 'https://registry.npmjs.org'

      - name: Install deps
        run: npm ci

      - name: Validate
        run: npm run validate

      # This action will usually create (or update) a "release" PR, containing a version bump and changelog updates
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          release-type: node

      # If the above action creates a GitHub release, then also publish to npm
      # This must be attached to this workflow, as one workflow cannot trigger another (e.g. on release create)
      - name: Publish to npm
        if: ${{ steps.release.outputs.release_created }}
        run: cd dist && npm publish --access public

      # Manual recovery publish for releases whose GitHub release object already exists:
      # release-please only outputs release_created on the run that creates it, so the
      # step above can never re-fire for them. Dispatch: gh workflow run push-master.yml --ref master
      - name: Publish to npm (manual dispatch)
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: cd dist && npm publish --access public
